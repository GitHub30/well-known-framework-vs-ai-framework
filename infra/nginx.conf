pid /tmp/clouddrive-run/nginx.pid;
error_log /tmp/clouddrive-run/nginx-error.log warn;
worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/manifest+json webmanifest;
    }

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 24m;

    client_body_temp_path /tmp/clouddrive-run/nginx-body;
    proxy_temp_path /tmp/clouddrive-run/nginx-proxy;
    fastcgi_temp_path /tmp/clouddrive-run/nginx-fastcgi;
    uwsgi_temp_path /tmp/clouddrive-run/nginx-uwsgi;
    scgi_temp_path /tmp/clouddrive-run/nginx-scgi;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/markdown
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # 8081: AI Custom Framework (zero external dependencies)
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        root /home/antigravity/GitHub30/well-known-framework-vs-ai-framework/apps/ai-framework/public;
        index index.php;

        location ~ /\.(?!well-known) {
            deny all;
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            try_files $uri =404;
        }
        location = /sw.js {
            charset utf-8;
            add_header Cache-Control "no-cache" always;
            add_header Service-Worker-Allowed "/" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }
        location / {
            try_files $uri /index.php$is_args$args;
        }
        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/tmp/clouddrive-run/fpm-ai.sock;
        }
    }

